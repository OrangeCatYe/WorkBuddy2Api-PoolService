name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ''
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整标签历史：版本号由 git describe 注入二进制。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        run: |
          npm --prefix web install
          npm --prefix web run build

      - name: 生成 Windows 版本信息资源
        if: matrix.os == 'windows'
        run: |
          # 给 exe 嵌入公司名、产品名、描述、版本号。没有版本信息的未签名 exe 更容易被杀毒软件的启发式规则怀疑。
          # 文件名带 _windows_amd64，Go 只会在构建 Windows 目标时链接它。
          version=$(git describe --tags --always)
          read -r major minor patch <<< "$(echo "$version" | sed -nE 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\1 \2 \3/p')"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1 -64 \
            -o cmd/poolsvc/resource_windows_amd64.syso \
            -ver-major "$major" -ver-minor "$minor" -ver-patch "$patch" \
            -product-ver-major "$major" -product-ver-minor "$minor" -product-ver-patch "$patch" \
            -file-version "$major.$minor.$patch.0" -product-version "$version" \
            cmd/poolsvc/versioninfo.json

      - name: 交叉编译
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          version=$(git describe --tags --always)
          ext="${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/orangeruan/poolservice/internal/panelapi.Version=$version" \
            -o "poolsvc-${{ matrix.os }}-${{ matrix.arch }}$ext" ./cmd/poolsvc
          go build -trimpath \
            -ldflags "-s -w -X github.com/orangeruan/poolservice/internal/panelapi.Version=$version" \
            -o "migrate-${{ matrix.os }}-${{ matrix.arch }}$ext" ./cmd/migrate
          echo "built poolsvc + migrate ($version)"

      - name: 生成发布版变更记录
        run: |
          # 源码 CHANGELOG 保留完整变更史；分发给用户的版本去掉内部开发代号。
          # 脚本会在残留未脱敏内容时以非零码退出，避免新增内容漏网。
          python scripts/sanitize_changelog.py CHANGELOG.md CHANGELOG.pub.md

      - name: 打包
        run: |
          name="poolsvc-${{ matrix.os }}-${{ matrix.arch }}"
          ext="${{ matrix.ext }}"
          mkdir -p "dist/$name"
          cp "poolsvc-${{ matrix.os }}-${{ matrix.arch }}$ext" "dist/$name/poolsvc$ext"
          cp "migrate-${{ matrix.os }}-${{ matrix.arch }}$ext" "dist/$name/migrate$ext"
          cp config.example.json README.md LICENSE "dist/$name/"
          cp CHANGELOG.pub.md "dist/$name/CHANGELOG.md"
          mkdir -p "dist/$name/autostart"
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp autostart/windows.ps1 "dist/$name/autostart/"
          else
            cp autostart/poolsvc.service "dist/$name/autostart/"
          fi
          if [ "${{ matrix.os }}" = "windows" ]; then
            printf '@echo off\r\npoolsvc.exe %%*\r\n' > "dist/$name/start.bat"
          else
            printf '#!/bin/sh\nexec "$(dirname "$0")/poolsvc" "$@"\n' > "dist/$name/start.sh"
            chmod +x "dist/$name/start.sh" "dist/$name/poolsvc" "dist/$name/migrate"
          fi
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r "../$name.zip" "$name"
            echo "asset=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "../$name.tar.gz" "$name"
            echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: 校验和
        working-directory: .
        run: |
          name="poolsvc-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: poolsvc-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            poolsvc-${{ matrix.os }}-${{ matrix.arch }}.zip
            poolsvc-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            *.sha256
          if-no-files-found: ignore

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: true

      - name: 生成更新清单并签名
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # latest.json 记录版本、更新说明和各平台安装包的 sha256；程序据此检查与校验更新，不走 GitHub API。
          # 用私钥对它签名（latest.json.sig），程序用内置公钥验签：下载源换成镜像也无法伪造更新。
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::$tag 不是 vX.Y.Z 正式版本标签，跳过更新清单"
            exit 0
          fi
          python scripts/sanitize_changelog.py CHANGELOG.md CHANGELOG.pub.md
          go run ./cmd/updatectl manifest -dir artifacts -tag "$tag" -changelog CHANGELOG.pub.md -out artifacts/latest.json
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::未配置 Secret UPDATE_SIGNING_KEY：本次发布没有更新签名，客户端只会提示新版本，不允许一键安装"
            exit 0
          fi
          go run ./cmd/updatectl sign -in artifacts/latest.json -out artifacts/latest.json.sig
          # 用程序内置公钥再验一遍：Secret 里的私钥必须和 internal/update/keys.go 里的公钥是一对，
          # 否则发出去的签名所有客户端都验不过，宁可在这里失败。
          go run ./cmd/updatectl verify -in artifacts/latest.json -sig artifacts/latest.json.sig

      - name: 生成发布说明
        run: |
          cat > notes.md <<'NOTES'
          ## 安装

          下载对应平台的压缩包，解压即可运行。

          **无需额外配置环境**：包内二进制为静态编译的单文件可执行程序，前端页面已内嵌，
          不依赖 Go、Node.js 或任何外部运行时，也无需安装依赖。

          解压后目录：

          ```text
          poolsvc            主服务（Windows 为 poolsvc.exe）
          migrate            旧版迁移工具（Windows 为 migrate.exe）
          start.sh / start.bat   启动脚本
          config.example.json    配置模板
          README.md  LICENSE  CHANGELOG.md
          ```

          启动：

          ```bash
          cp config.example.json config.json
          ./poolsvc            # Windows 双击 start.bat
          ```

          ## 从旧版 workbuddy2api-panel 迁移

          包内已附带迁移工具，直接运行即可，无需 Go 环境：

          ```bash
          # 先预览，不写文件
          ./migrate -from /path/to/wb2api-panel-v1.11.7-windows-amd64 -dry-run

          # 确认无误后实际执行
          ./migrate -from /path/to/wb2api-panel-v1.11.7-windows-amd64
          ```

          迁移后重启服务生效。

          ## 校验

          ```bash
          sha256sum -c poolsvc-linux-amd64.tar.gz.sha256
          ```
          NOTES
          sed -i 's/^          //' notes.md
          echo "" >> notes.md
          echo "## 校验" >> notes.md
          echo "" >> notes.md
          echo "```bash" >> notes.md
          echo "sha256sum -c poolsvc-linux-amd64.tar.gz.sha256" >> notes.md
          echo "```" >> notes.md

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # 同标签重复构建时先清理旧 Release，避免草稿堆叠
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            --title "$tag" \
            --notes-file notes.md \
            artifacts/*
