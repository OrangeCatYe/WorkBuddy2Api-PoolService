<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="286" viewBox="0 0 1400 286" fill="none" role="img" aria-labelledby="title description">
  <title id="title">PoolService 接入关系</title>
  <desc id="description">本人拥有的 WorkBuddy 国内版和国际版账号，经 PoolService 账号池、多协议网关与管理面板，接入 ttswitch、Claude Code 和 Codex CLI。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" stroke="#B18B50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1400" height="286" rx="22" fill="#F6F3ED"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="44" y="34" font-size="11" letter-spacing="3" fill="#9A7B4E">YOUR ACCOUNTS. ONE GATEWAY.</text>
    <rect x="44" y="62" width="298" height="170" rx="15" fill="#FFFDF9" stroke="#E0DACF"/>
    <text x="68" y="96" font-size="12" fill="#938574">账号来源</text>
    <text x="68" y="134" font-size="26" font-weight="600" fill="#242019">WorkBuddy</text>
    <text x="68" y="165" font-size="16" fill="#686259">国内版 / 国际版</text>
    <text x="68" y="205" font-size="12" fill="#938574">仅管理本人账号</text>
    <path d="M362 145H456" stroke="#B18B50" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="478" y="62" width="438" height="170" rx="15" fill="#242019"/>
    <circle cx="515" cy="98" r="10" stroke="#EFA33C" stroke-width="3"/>
    <circle cx="529" cy="98" r="10" stroke="#F6F3ED" stroke-width="3"/>
    <text x="551" y="106" font-size="25" font-weight="600" fill="#F6F3ED">PoolService</text>
    <text x="505" y="151" font-size="16" fill="#E9DCCA">账号池 · 积分中心 · 可视化运维</text>
    <rect x="503" y="174" width="388" height="34" rx="8" fill="#342D23"/>
    <text x="520" y="196" font-size="12" fill="#EFA33C">Chat Completions / Messages / Responses</text>
    <path d="M936 145H1030" stroke="#B18B50" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="1052" y="62" width="304" height="170" rx="15" fill="#FFFDF9" stroke="#E0DACF"/>
    <text x="1076" y="96" font-size="12" fill="#938574">编程客户端</text>
    <text x="1076" y="133" font-size="19" font-weight="600" fill="#242019">ttswitch</text>
    <text x="1076" y="164" font-size="19" font-weight="600" fill="#242019">Claude Code</text>
    <text x="1076" y="195" font-size="19" font-weight="600" fill="#242019">Codex CLI</text>
    <text x="44" y="265" font-size="12" fill="#938574">一个面板管理资源，一个网关统一接入。模型与可用能力以账号权限和上游返回为准。</text>
  </g>
</svg>
